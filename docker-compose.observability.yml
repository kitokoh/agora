# ============================================================================
# Agora — local observability stack (LGTM: Loki · Grafana · Tempo · Metrics)
# Enabled via profile:  docker compose --profile observability up -d
# See docs/observability.md §3.
# ============================================================================
name: agora-observability

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agora-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=24h'
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    profiles: ['observability']

  loki:
    image: grafana/loki:3.0.0
    container_name: agora-loki
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '3100:3100'
    profiles: ['observability']

  tempo:
    image: grafana/tempo:2.4.1
    container_name: agora-tempo
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./ops/observability/tempo.yml:/etc/tempo.yaml:ro
    ports:
      - '3200:3200'
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    profiles: ['observability']

  grafana:
    image: grafana/grafana:11.0.0
    container_name: agora-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: 'Admin'
    volumes:
      - ./ops/observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - tempo
    profiles: ['observability']
