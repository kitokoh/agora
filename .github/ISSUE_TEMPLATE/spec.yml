name: '📋 Spec (Spec Kit)'
description: New feature specification — start here for any feature work.
title: '[Spec] '
labels: ['spec']
body:
  - type: markdown
    attributes:
      value: |
        Follow the Spec Kit template: `specs/<NNN>-<name>/spec.md`.
        Status must become **Approved** before tasks are created.
  - type: input
    id: feature
    attributes:
      label: Feature name
      description: e.g. "identity-onboarding"
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: User stories (prioritized P1→P3)
      description: Each story independently testable, with Given/When/Then acceptance scenarios.
      placeholder: |
        ### User Story 1 — (P1)
        **Given** ..., **When** ..., **Then** ...
      render: markdown
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Functional requirements (FR-xxx) & entities
      render: markdown
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria (SC-xxx) — measurable
      render: markdown
    validations:
      required: true
  - type: textarea
    id: edge
    attributes:
      label: Edge cases
      render: markdown
  - type: checkboxes
    id: gates
    attributes:
      label: Hand-off gates
      options:
        - label: Spec written to `specs/<NNN>-<name>/spec.md` following the template
        - label: '`agent:architect` review requested'
        - label: Milestone label attached
