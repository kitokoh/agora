name: "🐛 Bug"
description: Something is broken — file with repro steps.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Repro steps
      description: Environment, exact steps, expected vs actual.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact & severity
      description: Who is affected, money path? (SEV-1..3)
    validations:
      required: true
  - type: input
    id: traces
    attributes:
      label: Request-id / trace / logs
      description: Paste correlation ids or link Sentry/Grafana.
  - type: checkboxes
    id: checks
    attributes:
      label: Triage
      options:
        - label: "Money path: label `security` + assign `agent:security`"
        - label: Reproduced on staging before fixing
