# gitleaks configuration (https://github.com/gitleaks/gitleaks)
# Baseline: default rules + repo-specific additions.
# CI enforces gitleaks via gitleaks/gitleaks-action@v2 (security job).

[extend]
useDefault = true

[allowlist]
description = "Repository-specific false positives"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.env\.example$''',
]
# Clé MFA de TEST (fausse, fixtures d'intégration — mêmes valeurs dans
# identity.integration.test.ts et catalog.integration.test.ts).
regexes = [
  '''test-mfa-key-0123456789abcdef''',
]
